version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-server
    environment:
      DATABASE_DSN: postgres://rag:rag@postgres:5432/rag?sslmode=disable
      DATABASE_AUTO_MIGRATE: "true"
      VECTORSTORE_URL: http://qdrant:6333
      VECTORSTORE_COLLECTION: rag_chunks
      VECTORSTORE_DESTRUCTIVE_MIGRATION: "true"
      LLM_PROVIDER: openai
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY for the selected provider}
      LLM_BASE_URL: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
      LLM_MODEL: Mistral-Small-3.2-24B-Instruct-2506
      LLM_EMBEDDING_MODEL: bge-m3
      LLM_EMBEDDING_DIM: "1024"
      BUFFER_ENABLED: "true"
      BUFFER_SERVICE_URL: ${BUFFER_SERVICE_URL:-http://host.docker.internal:5022/buffer}
      BUFFER_TOKEN: ${BUFFER_TOKEN:-local-dev-buffer-token}
      BUFFER_NAMESPACE: ${BUFFER_NAMESPACE:-rag}
      RAG_RETRIEVAL_MODE: binary_int8
      RAG_BINARY_CANDIDATES: "1000"
      RAG_ENABLE_FLOAT_FALLBACK: "true"
      LOGGING_LEVEL: info
      SERVER_ADDRESS: :8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
