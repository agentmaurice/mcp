version: '3'

vars:
  BINARY_NAME: rag
  DOCKER_IMAGE: rag-server
  DOCKER_TAG: latest

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BINARY_NAME}} ./cmd/rag

  run:
    desc: Run the application
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}}

  test:
    desc: Run tests
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...

  test-coverage:
    desc: Run tests with coverage report
    deps: [test]
    cmds:
      - go tool cover -html=coverage.out

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  generate:
    desc: Generate Ent code
    cmds:
      - go generate ./internal/storage/db/ent

  docker-build:
    desc: Build Docker image
    cmds:
      - docker build -f Dockerfile -t {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} ..

  docker-run:
    desc: Run Docker container
    deps: [docker-build]
    cmds:
      - docker run --rm -p 8080:8080 --env-file .env {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}

  compose-up:
    desc: Start all services with docker compose
    cmds:
      - docker compose up -d

  compose-down:
    desc: Stop all services
    cmds:
      - docker compose down

  compose-logs:
    desc: View logs
    cmds:
      - docker compose logs -f

  compose-restart:
    desc: Restart all services
    cmds:
      - docker compose restart

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY_NAME}}
      - rm -f coverage.out
      - go clean

  deps:
    desc: Check for outdated dependencies
    cmds:
      - go list -u -m all

  dev:
    desc: Run in development mode with hot reload
    cmds:
      - air

  db-reset:
    desc: "Reset database (WARNING: destroys all data)"
    cmds:
      - docker compose down -v
      - docker compose up -d postgres qdrant
      - echo "Waiting for services to be ready..."
      - sleep 10
      - echo "Database reset complete. Run 'task compose-up' to start all services."

  test-ingest:
    desc: Ingest test data from testdata/documents
    cmds:
      - ./scripts/ingest_test_data.sh {{.CLI_ARGS}}

  test-query:
    desc: "Test a RAG query (usage: task test-query -- 'Your question')"
    cmds:
      - ./scripts/test_query.sh {{.CLI_ARGS}}

  test-e2e:
    desc: Run end-to-end test (ingest + query)
    cmds:
      - echo "Test end-to-end du systeme RAG"
      - echo "=================================="
      - echo ""
      - echo "1. Ingestion des donnees de test..."
      - ./scripts/ingest_test_data.sh test-e2e-tenant
      - echo ""
      - echo "2. Test de requete..."
      - ./scripts/test_query.sh "Qu'est-ce que le RAG?" test-e2e-tenant
      - echo ""
      - echo "Test end-to-end termine!"
