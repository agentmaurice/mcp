[package]
name = "mcp-document"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "LicenseRef-Proprietary"
description = "AgentMaurice MCP server for local document conversion"

[dependencies]
anydoc = "=0.2.4"
anyhow = "1.0"
bytes = "1.11"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "=3.1.4", features = ["transport-io"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
