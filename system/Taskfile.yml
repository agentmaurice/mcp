version: '3'

tasks:
  fmt:
    cmds: [gofmt -w cmd internal]
  vet:
    cmds: [go vet ./...]
  test:
    cmds: [go test ./...]
  build:
    cmds:
      - go build -trimpath -o bin/system ./cmd/system
      - go build -trimpath -o bin/system-host-agent ./cmd/system-host-agent
  check:
    deps: [fmt, vet, test, build]
