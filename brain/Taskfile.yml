version: '3'

vars:
  BINARY_NAME: brain
  BUILD_DIR: .
  CMD_DIR: ./cmd/brain

tasks:
  build:
    desc: Build the brain server
    cmds:
      - go build -tags duckdb -o {{.BINARY_NAME}} {{.CMD_DIR}}
    sources:
      - '**/*.go'
    generates:
      - '{{.BINARY_NAME}}'

  run:
    desc: Run the brain server (SSE mode)
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}} -transport=sse

  run-stdio:
    desc: Run the brain server (stdio mode)
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}} -transport=stdio

  test:
    desc: Run tests
    cmds:
      - go test -tags duckdb -v ./...

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...

  clean:
    desc: Clean build artifacts and data
    cmds:
      - rm -f {{.BINARY_NAME}}
      - rm -rf data/

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  docker-build:
    desc: Build Docker image
    cmds:
      - docker build -f Dockerfile -t brain-server ..

  docker-build-sidecar:
    desc: Build sidecar-enabled Docker image
    cmds:
      - docker build --platform linux/amd64 -f Dockerfile.sidecar -t brain-sidecar:dev ..

  docker-run:
    desc: Run with Docker Compose
    cmds:
      - docker-compose up -d
